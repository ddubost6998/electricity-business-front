<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img alt="Your Company" class="mx-auto h-10 w-auto"
         src="https://tailwindui.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600">
    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Se connecter à mon compte</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <div *ngIf="errorMsg" class="w-full rounded-mb text-red-500 text-sm/6 font-medium mb-4">
      {{ errorMsg }}
    </div>

    <form (ngSubmit)="onSubmitLogin()"
          [formGroup]="form"
          class="space-y-6">
      <div>
        <label class="block text-sm/6 font-medium text-gray-900" for="email">Adresse mail</label>
        <div class="mt-2">
          <input
            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
            formControlName="email" id="email"
            name="email"
            type="email">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label class="block text-sm/6 font-medium text-gray-900" for="password">Mot de passe</label>
        </div>
        <div class="mt-2">
          <input
            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
            formControlName="password" id="password"
            name="password"
            type="password">
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-start">
          <div class="flex items-center h-5">
            <input class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300"
                   formControlName="remember"
                   id="remember"
                   type="checkbox">
          </div>
          <div class="ml-3 text-sm">
            <label class="text-gray-900 " for="remember">Rester connecté.e ?</label>
          </div>
        </div>
      </div>

      <div>
        <button [disabled]="form.invalid || requestOnGoing"
                class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600
        disabled:bg-indigo-300"
                type="submit">
          <span *ngIf="!requestOnGoing">Connexion</span>
          <span *ngIf="requestOnGoing">
            <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"
                 xmlns="http://www.w3.org/2000/svg">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                    fill="currentColor"></path>
            </svg>
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
