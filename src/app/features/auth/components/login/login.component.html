<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Connexion</h2>

    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email:</label>
        <input [ngClass]="{'border-red-500': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
               class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-blue-300"
               formControlName="email"
               id="email"
               type="email">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
             class="text-red-500 text-xs mt-1">
          <div *ngIf="loginForm.get('email')?.errors?.['required']">Email requis.</div>
          <div *ngIf="loginForm.get('email')?.errors?.['email']">Format d'email invalide.</div>
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Mot de passe:</label>
        <input [ngClass]="{'border-red-500' : loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
               class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-blue-300"
               formControlName="password"
               id="password"
               type="password">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
             class="text-red-500 text-xs">
          <div *ngIf="loginForm.get('password')?.errors?.['required']">Mot de passe requis.</div>
        </div>
      </div>

      <button [disabled]="loginForm.invalid"
              class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline disabled:opacity-50 disabled:cursor-not-allowed"
              type="submit">
        Se Connecter
      </button>
    </form>

    <div class="mt-4 text-center">
      Pas encore de compte ? <a class="text-blue-500 hover:underline" routerLink="/auth/register">Inscrivez-vous</a>
    </div>

    <div *ngIf="errorMessage" class="text-red-500 mt-4 text-center">
      {{ errorMessage }}
    </div>
  </div>
</div>
